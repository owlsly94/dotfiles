[widget.clock]
format = "{:%H:%M %a %e.%b}"

[widget.cpu]
display = "text"
visualization = "none"

[widget.cputemp]
display = "text"
stat = "cpu_temp"

[widget.launcher]
glyph = "menu-2"
scale = 1.1000000000000001

[widget.network]
show_label = false

[widget.ram]
display = "text"
visualization = "none"

[widget.temp]
display = "text"
visualization = "none"

[widget.workspaces]
hide_when_empty = true
labels_only_when_occupied = true
occupied_color = "tertiary"
scale = 1.1000000000000001